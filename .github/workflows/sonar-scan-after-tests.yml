# Reusable orchestrator: resolves workflow_run / manual test-run context, then runs sonar-scan.yml.
# Consumer repos keep a thin trigger workflow (workflow_run + optional workflow_dispatch).

name: SonarQube Scan After Tests

on:
  workflow_call:
    inputs:
      sonar-node-max-space:
        description: Forwarded SonarJS Node heap ceiling in MiB.
        required: false
        type: string
        default: '4096'
      runner-labels-json:
        description: >-
          JSON array (or string) for runs-on. Default keeps GitHub-hosted
          ubuntu-latest so existing consumers are unaffected.
        required: false
        type: string
        default: '"ubuntu-latest"'
      test-run-id:
        description: >-
          Actions run ID of a completed test workflow. Required when the caller was triggered via
          workflow_dispatch. Leave empty when the caller was triggered via workflow_run (run ID is
          read from github.event.workflow_run.id).
        required: false
        type: string
        default: ""
      fetch-depth:
        description: Git fetch depth passed through to the scan job.
        required: false
        type: number
        default: 0
      coverage-artifacts-json:
        description: >-
          JSON array of {"name":"<artifact>","path":"<dir>"} passed to sonar-scan.yml. Empty skips
          coverage downloads.
        required: false
        type: string
        default: ""
      install-node-dependencies:
        description: Passed through to sonar-scan.yml (auto | true | false).
        required: false
        type: string
        default: auto
      node-project-directory:
        description: Passed through to sonar-scan.yml.
        required: false
        type: string
        default: "."
      node-version-file:
        description: Passed through to sonar-scan.yml.
        required: false
        type: string
        default: .nvmrc
      pnpm-version:
        description: Passed through to sonar-scan.yml.
        required: false
        type: string
        default: ""
      java-artifacts-json:
        description: >-
          Opt-in JSON array of {"path":"repo-relative directory","kind":"binaries|test-binaries|libraries|test-libraries"}.
          Each directory must contain untracked .class files (binaries) or .jar files (libraries).
          At least one binaries directory is required. Empty disables Java artifact setup.
        required: false
        type: string
        default: ""
      java-version:
        description: Exact Temurin JDK version including build (for example 17.0.12+7); required with java-artifacts-json.
        required: false
        type: string
        default: ""
      pre-sonar-command:
        description: Optional shell command before Sonar scanner (repo-local coverage scope, etc.).
        required: false
        type: string
        default: ""
      issue-gate-scope:
        description: Passed through to sonar-scan.yml (off | new-code | all-open).
        required: false
        type: string
        default: all-open
      enforce-zero-unreviewed-hotspots:
        description: Independently fail on any TO_REVIEW hotspot in the selected PR or branch, regardless of the server quality gate.
        required: false
        type: boolean
        default: false
      enforce-quality-gate:
        description: Passed through to sonar-scan.yml. When false, prints Quality Gate diagnostics without failing the workflow on the project gate.
        required: false
        type: boolean
        default: true
      enforce-zero-open-issues:
        description: Deprecated — use issue-gate-scope. Passed through to sonar-scan.yml.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: Forwarded to sonar-scan.yml. Callers outside Casadega-Development must map it explicitly.
        required: true
      NODE_AUTH_TOKEN:
        description: Optional package-registry read token forwarded only to the dependency install.
        required: false

jobs:
  resolve:
    name: Resolve scan context
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      coverage-run-id: ${{ steps.context.outputs.coverage-run-id }}
      checkout-ref: ${{ steps.context.outputs.checkout-ref }}
      use-pull-request-scan: ${{ steps.context.outputs.use-pull-request-scan }}
      pull-request-key: ${{ steps.context.outputs.pull-request-key }}
      pull-request-branch: ${{ steps.context.outputs.pull-request-branch }}
      pull-request-base: ${{ steps.context.outputs.pull-request-base }}
      scm-revision: ${{ steps.context.outputs.scm-revision }}
      branch-name: ${{ steps.context.outputs.branch-name }}
    steps:
      - name: Resolve from workflow_run or test-run-id
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TEST_RUN_ID: ${{ inputs.test-run-id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          else
            RUN_ID="$INPUT_TEST_RUN_ID"
          fi
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Expected a numeric GitHub Actions test run ID."
            exit 1
          fi

          # Read metadata anchored to the original run, even when dispatching a rescan
          # after the pull request was merged or the head branch was removed.
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          RUN_EVENT=$(jq -er '.event | strings | select(length > 0)' <<< "$RUN_JSON")
          HEAD_SHA=$(jq -er '.head_sha | strings | select(test("^[0-9a-f]{40}$"))' <<< "$RUN_JSON")
          HEAD_BRANCH=$(jq -er '.head_branch | strings | select(length > 0)' <<< "$RUN_JSON")
          git check-ref-format "refs/heads/$HEAD_BRANCH"

          if [ "$RUN_EVENT" = "pull_request_target" ]; then
            echo "::error::A pull_request_target run does not establish the tested PR head revision."
            exit 1
          fi

          if [ "$RUN_EVENT" = "pull_request" ]; then
            HEAD_REPOSITORY_ID=$(jq -er '.head_repository.id | numbers' <<< "$RUN_JSON")
            BASE_REPOSITORY_ID=$(jq -er '.repository.id | numbers' <<< "$RUN_JSON")

            # A commit can be associated with several PRs. Match the original head
            # ref and both repository identities before considering a candidate.
            match_prs() {
              jq -c --arg head "$HEAD_BRANCH" --argjson source "$HEAD_REPOSITORY_ID" \
                --argjson target "$BASE_REPOSITORY_ID" \
                '[.[] | select(.head.ref == $head and .head.repo.id == $source and .base.repo.id == $target)] | unique_by(.number)'
            }

            PRS=$(jq -c '.pull_requests // []' <<< "$RUN_JSON" | match_prs)
            if [ "$(jq 'length' <<< "$PRS")" -ne 1 ]; then
              # GitHub may omit the PR association on the workflow run. Lookup by
              # tested SHA can recover a merged PR without guessing by branch name.
              PRS=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls?per_page=100" \
                | jq -c 'add // []' | match_prs)
            fi
            if [ "$(jq 'length' <<< "$PRS")" -ne 1 ]; then
              echo "::error::No unique pull request matches the tested commit for run ${RUN_ID}; scan stopped."
              exit 1
            fi

            PR_NUMBER=$(jq -er '.[0].number | numbers | tostring | select(test("^[1-9][0-9]*$"))' <<< "$PRS")
            PR_BASE=$(jq -er '.[0].base.ref | strings | select(length > 0)' <<< "$PRS")
            git check-ref-format "refs/heads/$PR_BASE"
          fi

          {
            echo "coverage-run-id=${RUN_ID}"
            echo "checkout-ref=${HEAD_SHA}"
            echo "scm-revision=${HEAD_SHA}"
            if [ "$RUN_EVENT" = "pull_request" ]; then
              echo "use-pull-request-scan=true"
              echo "pull-request-key=${PR_NUMBER}"
              echo "pull-request-branch=${HEAD_BRANCH}"
              echo "pull-request-base=${PR_BASE}"
            else
              echo "use-pull-request-scan=false"
              echo "branch-name=${HEAD_BRANCH}"
            fi
          } >> "$GITHUB_OUTPUT"

  sonarqube:
    name: SonarQube Scan
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/sonar-scan.yml
    with:
      prerequisite-result: ${{ needs.resolve.result }}
      sonar-node-max-space: ${{ inputs.sonar-node-max-space }}
      runner-labels-json: ${{ inputs.runner-labels-json }}
      fetch-depth: ${{ inputs.fetch-depth }}
      coverage-artifacts-run-id: ${{ needs.resolve.outputs.coverage-run-id }}
      checkout-ref: ${{ needs.resolve.outputs.checkout-ref }}
      use-pull-request-scan: ${{ needs.resolve.outputs.use-pull-request-scan == 'true' }}
      pull-request-key: ${{ needs.resolve.outputs.pull-request-key }}
      pull-request-branch: ${{ needs.resolve.outputs.pull-request-branch }}
      pull-request-base: ${{ needs.resolve.outputs.pull-request-base }}
      scm-revision: ${{ needs.resolve.outputs.scm-revision }}
      branch-name: ${{ needs.resolve.outputs.branch-name }}
      coverage-artifacts-json: ${{ inputs.coverage-artifacts-json }}
      install-node-dependencies: ${{ inputs.install-node-dependencies }}
      node-project-directory: ${{ inputs.node-project-directory }}
      node-version-file: ${{ inputs.node-version-file }}
      pnpm-version: ${{ inputs.pnpm-version }}
      java-artifacts-json: ${{ inputs.java-artifacts-json }}
      java-version: ${{ inputs.java-version }}
      pre-sonar-command: ${{ inputs.pre-sonar-command }}
      issue-gate-scope: ${{ inputs.issue-gate-scope }}
      enforce-zero-unreviewed-hotspots: ${{ inputs.enforce-zero-unreviewed-hotspots }}
      enforce-quality-gate: ${{ inputs.enforce-quality-gate }}
      enforce-zero-open-issues: ${{ inputs.enforce-zero-open-issues }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
