# Validate this repository's Sonar contracts; this is local CI, not another reusable catalog.
name: Check Sonar workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate workflow syntax and embedded shell
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Exercise offline gates and isolation boundaries
        run: python3 -m unittest discover -s tests -v
