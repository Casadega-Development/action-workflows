# Reusable SonarQube scan: PR vs branch parameters, coverage download, CE wait,
# optional issue gate, and the official quality-gate action.
#
# Callers must grant `actions: read`, `contents: read`, and `packages: read` on the job that `uses:`
# this workflow. Pass SONAR_TOKEN explicitly — `secrets: inherit` does not cross GitHub organization
# boundaries. Node projects with private dependencies must also map a caller-owned package token
# into NODE_AUTH_TOKEN.
# The checked-out repository's committed `sonar.host.url` is the only server authority. An inherited
# repository variable is compared for diagnostics and ignored when it disagrees.
#
# Adapted from black-flag-collective/action-workflows. Do not pin
# sonarqube-quality-gate-action to v1.3.1 — that tag does not exist.

name: SonarQube Scan

on:
  workflow_call:
    inputs:
      runner-labels-json:
        description: >-
          JSON array (or string) for runs-on. Default keeps GitHub-hosted
          ubuntu-latest so existing consumers are unaffected.
        required: false
        type: string
        default: '"ubuntu-latest"'
      fetch-depth:
        description: Git fetch depth for checkout; 0 disables shallow clone (recommended for Sonar).
        required: false
        type: number
        default: 0
      checkout-ref:
        description: Git ref to checkout (commit SHA or branch). Empty uses the default ref for the event.
        required: false
        type: string
        default: ""
      coverage-artifacts-json:
        description: >-
          JSON array of {"name":"<GitHub artifact name>","path":"<repo-relative dir>"}.
          Empty skips all coverage downloads. Non-empty downloads each artifact before scan.
        required: false
        type: string
        default: ""
      coverage-artifacts-run-id:
        description: >-
          Workflow run ID to download coverage artifacts from. Empty uses the current workflow run.
        required: false
        type: string
        default: ""
      install-node-dependencies:
        description: >-
          Whether to restore a Node project's locked dependencies before analysis. auto installs
          when node-project-directory contains package.json and exactly one recognized lockfile;
          true requires that shape; false opts out. Installing dependencies allows SonarJS to
          resolve external type declarations instead of degrading semantic TypeScript analysis.
        required: false
        type: string
        default: auto
      node-project-directory:
        description: >-
          Repository-relative directory containing package.json and its lockfile. This supports
          repositories whose Node project is not at the checkout root without accepting an
          arbitrary dependency-install shell command.
        required: false
        type: string
        default: "."
      node-version-file:
        description: >-
          File, relative to node-project-directory, used by actions/setup-node. The workflow uses
          it when present, otherwise package.json when it declares a supported Node version, and
          finally the current LTS release.
        required: false
        type: string
        default: .nvmrc
      pnpm-version:
        description: >-
          pnpm version used only when pnpm-lock.yaml is authoritative. Empty derives the version
          from package.json's packageManager field; pnpm repositories without either value fail
          before installation with an actionable error.
        required: false
        type: string
        default: ""
      pre-sonar-command:
        description: >-
          Optional shell command after checkout and coverage download, before Sonar scanner
          (e.g. node scripts/generate-sonar-coverage-exclusions.mjs).
        required: false
        type: string
        default: ""
      use-pull-request-scan:
        description: Use sonar.pullrequest.* parameters (Community branch plugin PR decoration).
        required: false
        type: boolean
        default: false
      pull-request-key:
        description: PR number for sonar.pullrequest.key when use-pull-request-scan is true.
        required: false
        type: string
        default: ""
      pull-request-branch:
        description: Head branch for sonar.pullrequest.branch.
        required: false
        type: string
        default: ""
      pull-request-base:
        description: Base branch for sonar.pullrequest.base.
        required: false
        type: string
        default: ""
      scm-revision:
        description: Commit SHA for sonar.scm.revision (PR scans).
        required: false
        type: string
        default: ""
      branch-name:
        description: Branch name for sonar.branch.name when use-pull-request-scan is false.
        required: false
        type: string
        default: ""
      issue-gate-scope:
        description: >-
          Extra unresolved-issue API gate after CE processing. all-open = fail on any unresolved
          issue on the PR/branch (default). new-code = fail on unresolved issues in new code
          (inNewCodePeriod). off = Quality Gate only (no API issue gate).
        required: false
        type: string
        default: all-open
      enforce-quality-gate:
        description: >-
          Run the official sonarqube-quality-gate-action after diagnostics. Set false for
          baselined repos that still need scan uploads and Quality Gate diagnostics without
          failing the GitHub workflow on the project gate.
        required: false
        type: boolean
        default: true
      enforce-zero-open-issues:
        description: >-
          Deprecated — use issue-gate-scope. When true and issue-gate-scope is off, behaves as
          all-open.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: >-
          SonarQube project analysis token from the calling repository. A user
          token is for local CLI/precheck only; CI must use a project analysis
          token (or a user token with Execute Analysis on that project).
        required: true
      NODE_AUTH_TOKEN:
        description: >-
          Optional package-registry read token exposed only to the dependency-install step. Map a
          caller-owned token when package.json resolves private packages; public-only projects may
          omit it.
        required: false

jobs:
  sonarqube:
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    # Dependency restoration adds bounded work before analysis, while the Compute Engine polling
    # loop may independently consume ten minutes. Twenty minutes leaves room for both without
    # making a genuinely stuck scan linger indefinitely.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}

      - name: Resolve Node dependency installation
        id: node-dependencies
        env:
          INSTALL_MODE: ${{ inputs.install-node-dependencies }}
          NODE_PROJECT_DIRECTORY: ${{ inputs.node-project-directory }}
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          PNPM_VERSION_OVERRIDE: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail

          # Normalize the configured project directory before inspecting files. Restricting the
          # value to the checked-out repository prevents a reusable-workflow caller from making
          # the install or cache steps operate on runner-owned paths outside the source tree.
          project_directory="${NODE_PROJECT_DIRECTORY%/}"
          if [ -z "$project_directory" ]; then
            project_directory="."
          fi
          case "$project_directory$NODE_VERSION_FILE$PNPM_VERSION_OVERRIDE" in
            *$'\n'*|*$'\r'*)
              echo "::error::Node dependency inputs must be single-line values."
              exit 1
              ;;
          esac
          case "$project_directory" in
            /*|..|../*|*/../*|*/..)
              echo "::error::node-project-directory must remain inside the checked-out repository."
              exit 1
              ;;
          esac
          case "$NODE_VERSION_FILE" in
            /*|..|../*|*/../*|*/..)
              echo "::error::node-version-file must remain inside node-project-directory."
              exit 1
              ;;
          esac
          if [ ! -d "$project_directory" ]; then
            echo "::error::node-project-directory does not exist: ${project_directory}"
            exit 1
          fi
          workspace_path=$(realpath "$GITHUB_WORKSPACE")
          project_path=$(realpath "$project_directory")
          case "$project_path" in
            "$workspace_path"|"$workspace_path"/*) ;;
            *)
              echo "::error::node-project-directory resolves outside the checked-out repository."
              exit 1
              ;;
          esac

          package_json="${project_directory}/package.json"
          lockfile_count=0
          package_manager=""
          lockfile_path=""

          # A single authoritative lockfile is required for reproducible analysis. Silently
          # preferring one package manager would let Sonar analyze a dependency graph that differs
          # from the graph used by the repository's own quality and build jobs.
          if [ -f "${project_directory}/package-lock.json" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="npm"
            lockfile_path="${project_directory}/package-lock.json"
          fi
          if [ -f "${project_directory}/npm-shrinkwrap.json" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="npm"
            lockfile_path="${project_directory}/npm-shrinkwrap.json"
          fi
          if [ -f "${project_directory}/pnpm-lock.yaml" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="pnpm"
            lockfile_path="${project_directory}/pnpm-lock.yaml"
          fi
          if [ -f "${project_directory}/yarn.lock" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="yarn"
            lockfile_path="${project_directory}/yarn.lock"
          fi

          if [ "$lockfile_count" -gt 1 ]; then
            echo "::error::Found multiple recognized lockfiles in ${project_directory}; keep exactly one authoritative package-manager lockfile."
            exit 1
          fi

          case "$INSTALL_MODE" in
            auto)
              if [ -f "$package_json" ] && [ "$lockfile_count" -eq 1 ]; then
                should_install=true
              else
                should_install=false
              fi
              ;;
            true)
              if [ ! -f "$package_json" ]; then
                echo "::error::install-node-dependencies=true requires ${package_json}."
                exit 1
              fi
              if [ "$lockfile_count" -ne 1 ]; then
                echo "::error::install-node-dependencies=true requires exactly one recognized lockfile in ${project_directory}."
                exit 1
              fi
              should_install=true
              ;;
            false)
              should_install=false
              ;;
            *)
              echo "::error::install-node-dependencies must be auto, true, or false; received '${INSTALL_MODE}'."
              exit 1
              ;;
          esac

          if [ "$INSTALL_MODE" = "auto" ] && [ "$should_install" = false ]; then
            if [ -f "$package_json" ] && [ "$lockfile_count" -eq 0 ]; then
              echo "::warning::Found ${package_json} without a recognized lockfile. Dependencies will not be installed, so SonarJS type inference may be incomplete."
            elif [ ! -f "$package_json" ] && [ "$lockfile_count" -eq 1 ]; then
              echo "::warning::Found ${lockfile_path} without ${package_json}; dependencies cannot be restored."
            else
              echo "::notice::No locked Node project found in ${project_directory}; skipping dependency installation."
            fi
          fi

          declared_package_manager=""
          declared_package_manager_version=""
          if [ -f "$package_json" ]; then
            package_manager_declaration=$(jq -r '.packageManager // empty' "$package_json")
            case "$package_manager_declaration" in
              *$'\n'*|*$'\r'*)
                echo "::error::packageManager in ${package_json} must be a single-line value."
                exit 1
                ;;
            esac
            case "$package_manager_declaration" in
              npm@*|pnpm@*|yarn@*)
                declared_package_manager="${package_manager_declaration%%@*}"
                declared_package_manager_version="${package_manager_declaration#*@}"
                declared_package_manager_version="${declared_package_manager_version%%+*}"
                ;;
              "") ;;
              *)
                echo "::error::Unsupported packageManager declaration in ${package_json}: ${package_manager_declaration}"
                exit 1
                ;;
            esac
          fi

          if [ "$should_install" = true ] && [ -n "$declared_package_manager" ] && [ "$declared_package_manager" != "$package_manager" ]; then
            echo "::error::packageManager declares ${declared_package_manager}, but ${lockfile_path} selects ${package_manager}."
            exit 1
          fi

          pnpm_version="$PNPM_VERSION_OVERRIDE"
          if [ "$should_install" = true ] && [ "$package_manager" = "pnpm" ] && [ -z "$pnpm_version" ]; then
            if [ "$declared_package_manager" != "pnpm" ] || [ -z "$declared_package_manager_version" ]; then
              echo "::error::A pnpm project must declare packageManager as pnpm@<version> or pass pnpm-version."
              exit 1
            fi
            pnpm_version="$declared_package_manager_version"
          fi

          version_file=""
          node_version=""
          configured_version_file="${project_directory}/${NODE_VERSION_FILE}"
          if [ "$should_install" = true ] && [ -n "$NODE_VERSION_FILE" ] && [ -f "$configured_version_file" ]; then
            version_file="$configured_version_file"
          elif [ "$should_install" = true ] && jq -e \
            '(.volta.node != null) or (.engines.node != null) or (.devEngines.runtime != null)' \
            "$package_json" >/dev/null 2>&1; then
            version_file="$package_json"
            echo "::notice::Using the Node version declared by ${package_json}."
          else
            node_version="lts/*"
          fi

          # Every emitted value is derived from a validated path or a fixed enumeration. The
          # workflow deliberately avoids accepting an arbitrary install command and forwarding it
          # through GITHUB_OUTPUT, which would make newline handling and shell trust ambiguous.
          {
            echo "should-install=${should_install}"
            echo "package-manager=${package_manager}"
            echo "project-directory=${project_directory}"
            echo "lockfile-path=${lockfile_path}"
            echo "version-file=${version_file}"
            echo "node-version=${node_version}"
            echo "pnpm-version=${pnpm_version}"
          } >> "$GITHUB_OUTPUT"

          echo "Node dependency install: ${should_install} (mode=${INSTALL_MODE}, manager=${package_manager:-none}, directory=${project_directory})."

      # setup-node's pnpm cache invokes `pnpm store path`, so pnpm must already be on PATH. The
      # exact version is taken from the consumer's committed packageManager declaration unless an
      # explicit reusable-workflow input overrides it.
      - name: Set up pnpm
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.node-dependencies.outputs.pnpm-version }}
          run_install: false

      - name: Set up Node.js for dependency analysis
        if: steps.node-dependencies.outputs.should-install == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ steps.node-dependencies.outputs.version-file }}
          node-version: ${{ steps.node-dependencies.outputs.node-version }}
          cache: ${{ steps.node-dependencies.outputs.package-manager }}
          cache-dependency-path: ${{ steps.node-dependencies.outputs.lockfile-path }}

      - name: Install locked npm dependencies
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'npm'
        working-directory: ${{ steps.node-dependencies.outputs.project-directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Install locked pnpm dependencies
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'pnpm'
        working-directory: ${{ steps.node-dependencies.outputs.project-directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Install locked Yarn dependencies
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'yarn'
        working-directory: ${{ steps.node-dependencies.outputs.project-directory }}
        run: yarn install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Resolve committed SonarQube identity
        id: sonar-identity
        env:
          # Retain the former caller variable only as a migration diagnostic. It must never select
          # where a checked-out repository publishes source.
          AMBIENT_SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail

          # Node is already present on every supported GitHub-hosted runner and gives this preflight
          # standards-based URL parsing. Keeping the parser here makes the reusable workflow
          # self-contained because actions/checkout checks out the caller, not this catalog repo.
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const propertiesPath = 'sonar-project.properties';

          /**
           * Stops the identity preflight with a concise GitHub Actions annotation.
           *
           * @param {string} message Actionable configuration failure without credential material.
           * @returns {never} This helper always terminates the current Node process.
           */
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          /**
           * Reads one required plain-text Sonar property without accepting a lookalike key.
           *
           * Both `=` and `:` separators are valid Java Properties syntax. Anchored expressions
           * prevent names such as `sonar.host.urlsuffix` from satisfying the server identity check.
           *
           * @param {string} contents Complete scanner properties contents.
           * @param {RegExp} pattern Anchored property-specific extraction expression.
           * @param {string} key Human-readable property name used in failures.
           * @returns {string} Non-empty committed value.
           */
          function readRequiredProperty(contents, pattern, key) {
            for (const line of contents.split(/\r?\n/u)) {
              const match = pattern.exec(line);
              const value = match?.[1]?.trim();
              if (value) return value;
            }
            fail(`${propertiesPath} must define a non-empty ${key}.`);
          }

          /**
           * Canonicalizes a SonarQube server while preserving a meaningful context path.
           *
           * URL parsing normalizes scheme and hostname case plus default ports. Trailing separators
           * are removed with a linear loop so the safety preflight cannot introduce a
           * backtracking-regex hotspot of its own.
           *
           * @param {string} value Candidate committed or ambient server URL.
           * @returns {string} Canonical HTTP(S) server URL without trailing slashes.
           */
          function normalizeHost(value) {
            const parsed = new URL(value.trim());
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
              throw new Error('sonar.host.url must use HTTP or HTTPS.');
            }
            if (parsed.username || parsed.password) {
              throw new Error('sonar.host.url must not contain embedded credentials.');
            }
            parsed.search = '';
            parsed.hash = '';
            let normalized = parsed.toString();
            while (normalized.endsWith('/')) normalized = normalized.slice(0, -1);
            return normalized;
          }

          let contents;
          try {
            contents = readFileSync(propertiesPath, 'utf8');
          } catch {
            fail(`Unable to read committed ${propertiesPath}.`);
          }

          const rawHost = readRequiredProperty(
            contents,
            /^\s*sonar\.host\.url\s*[=:]\s*(.*?)\s*$/u,
            'sonar.host.url',
          );
          const projectKey = readRequiredProperty(
            contents,
            /^\s*sonar\.projectKey\s*[=:]\s*(.*?)\s*$/u,
            'sonar.projectKey',
          );
          let hostUrl;
          try {
            hostUrl = normalizeHost(rawHost);
          } catch {
            fail(
              `${propertiesPath} must define sonar.host.url as a fully-qualified HTTP(S) URL without embedded credentials.`,
            );
          }
          const ambientHost = process.env.AMBIENT_SONAR_HOST_URL?.trim();

          if (ambientHost) {
            let conflicts = true;
            try {
              conflicts = normalizeHost(ambientHost) !== hostUrl;
            } catch {
              // A malformed inherited variable is still a conflict, but its value is deliberately
              // omitted from logs in case someone accidentally embedded credentials in it.
            }
            if (conflicts) {
              console.warn(
                `::warning::Ignoring SONAR_HOST_URL because committed ${propertiesPath} pins ${hostUrl}.`,
              );
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `host_url=${hostUrl}\nproject_key=${projectKey}\n`);
          console.log(`Using committed SonarQube host ${hostUrl} for project ${projectKey}.`);
          NODE

      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty in the reusable workflow. Map it explicitly on the caller job (SONAR_TOKEN from the calling repository). secrets: inherit does not pass repository secrets from a personal repo into Casadega-Development."
            exit 1
          fi

      - name: Download coverage artifacts
        if: inputs.coverage-artifacts-json != '' && inputs.coverage-artifacts-json != '[]'
        env:
          COVERAGE_ARTIFACTS_JSON: ${{ inputs.coverage-artifacts-json }}
          COVERAGE_ARTIFACTS_RUN_ID: ${{ inputs.coverage-artifacts-run-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! echo "$COVERAGE_ARTIFACTS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null; then
            echo "coverage-artifacts-json must be a non-empty JSON array." >&2
            exit 1
          fi

          if [ -n "$COVERAGE_ARTIFACTS_RUN_ID" ]; then
            RUN_ID="$COVERAGE_ARTIFACTS_RUN_ID"
          else
            RUN_ID="$GITHUB_RUN_ID"
          fi

          succeeded=0
          failed=0
          while IFS= read -r item; do
            name=$(echo "$item" | jq -r '.name')
            path=$(echo "$item" | jq -r '.path')
            if [ -z "$name" ] || [ "$name" = "null" ] || [ -z "$path" ] || [ "$path" = "null" ]; then
              echo "::warning::Skipping invalid coverage artifact entry: ${item}"
              failed=$((failed + 1))
              continue
            fi
            mkdir -p "$path"
            if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D "$path"; then
              echo "Downloaded artifact ${name} to ${path}"
              succeeded=$((succeeded + 1))
            else
              echo "::warning::Failed to download artifact ${name} (run ${RUN_ID}) to ${path}"
              failed=$((failed + 1))
            fi
          done < <(echo "$COVERAGE_ARTIFACTS_JSON" | jq -c '.[]')

          if [ "$succeeded" -eq 0 ]; then
            # Artifact downloads are transiently flaky (expired/missing artifacts).
            # Continue without coverage instead of failing the scan.
            echo "::warning::No coverage artifacts downloaded (${failed} failed); continuing without coverage."
          fi

      - name: Pre-Sonar command
        if: inputs.pre-sonar-command != ''
        run: ${{ inputs.pre-sonar-command }}

      - name: Apply generated Sonar coverage properties
        if: hashFiles('sonar-project.coverage.generated.properties') != ''
        run: cat sonar-project.coverage.generated.properties >> sonar-project.properties

      # Community Edition + sonarqube-community-branch-plugin requires explicit pull-request
      # parameters (and sonar.scm.revision on GitHub). Do not set sonar.branch.* on PR scans.
      # https://github.com/mc1arke/sonarqube-community-branch-plugin#how-to-decorate-a-pull-request
      # The scanner engine occasionally fails transiently (EXECUTION FAILURE / exit 3).
      # Each scan step gets a single retry: the first attempt uses continue-on-error,
      # and the retry step only runs when the first attempt failed.
      - name: SonarQube Scan (pull request)
        id: scan-pr
        if: inputs.use-pull-request-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >-
            -Dsonar.pullrequest.key=${{ inputs.pull-request-key }}
            -Dsonar.pullrequest.branch=${{ inputs.pull-request-branch }}
            -Dsonar.pullrequest.base=${{ inputs.pull-request-base }}
            -Dsonar.scm.revision=${{ inputs.scm-revision }}
            -Dsonar.host.url=${{ steps.sonar-identity.outputs.host_url }}
            -Dsonar.qualitygate.wait=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}

      - name: SonarQube Scan (pull request, retry)
        if: inputs.use-pull-request-scan && steps.scan-pr.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >-
            -Dsonar.pullrequest.key=${{ inputs.pull-request-key }}
            -Dsonar.pullrequest.branch=${{ inputs.pull-request-branch }}
            -Dsonar.pullrequest.base=${{ inputs.pull-request-base }}
            -Dsonar.scm.revision=${{ inputs.scm-revision }}
            -Dsonar.host.url=${{ steps.sonar-identity.outputs.host_url }}
            -Dsonar.qualitygate.wait=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}

      - name: SonarQube Scan (branch)
        id: scan-branch
        if: ${{ !inputs.use-pull-request-scan }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >-
            -Dsonar.branch.name=${{ inputs.branch-name }}
            -Dsonar.host.url=${{ steps.sonar-identity.outputs.host_url }}
            -Dsonar.qualitygate.wait=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}

      - name: SonarQube Scan (branch, retry)
        if: ${{ !inputs.use-pull-request-scan && steps.scan-branch.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >-
            -Dsonar.branch.name=${{ inputs.branch-name }}
            -Dsonar.host.url=${{ steps.sonar-identity.outputs.host_url }}
            -Dsonar.qualitygate.wait=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}

      - name: Resolve Sonar issue gate scope
        id: issue-gate-scope
        run: |
          set -euo pipefail
          scope="${{ inputs.issue-gate-scope }}"
          case "$scope" in
            off|new-code|all-open) ;;
            *)
              echo "issue-gate-scope must be off, new-code, or all-open (got: ${scope})" >&2
              exit 1
              ;;
          esac
          if [ "$scope" = "off" ] && [ "${{ inputs.enforce-zero-open-issues }}" = "true" ]; then
            echo "::notice::enforce-zero-open-issues is deprecated; using issue-gate-scope=all-open"
            scope="all-open"
          fi
          echo "effective=${scope}" >> "$GITHUB_OUTPUT"
          echo "Sonar issue gate scope: ${scope}"

      - name: Wait for SonarQube background task
        id: sonar-ce-wait
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}
        run: |
          set -euo pipefail

          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "No SonarQube report-task.txt found; skipping CE wait."
            exit 0
          fi

          ce_task_id=$(awk -F= '$1 == "ceTaskId" {print $2; exit}' .scannerwork/report-task.txt)
          if [ -z "$ce_task_id" ]; then
            echo "No SonarQube ceTaskId found; skipping CE wait."
            exit 0
          fi

          # report-task.txt is produced by the scanner and therefore provides an independent
          # canary that the completed upload used the same authority selected before analysis.
          reported_server_url=$(awk -F= '$1 == "serverUrl" {print $2; exit}' .scannerwork/report-task.txt)
          if [ -n "$reported_server_url" ] && [ "${reported_server_url%/}" != "${SONAR_HOST_URL%/}" ]; then
            echo "SonarScanner reported server ${reported_server_url}, but committed configuration requires ${SONAR_HOST_URL}." >&2
            exit 1
          fi

          api_base="${SONAR_HOST_URL%/}/api"
          analysis_id=""
          for _ in $(seq 1 120); do
            task_json=$(curl -fsS -u "${SONAR_TOKEN}:" "${api_base}/ce/task?id=${ce_task_id}")
            task_status=$(echo "$task_json" | jq -r '.task.status')
            if [ "$task_status" = "SUCCESS" ]; then
              analysis_id=$(echo "$task_json" | jq -r '.task.analysisId')
              break
            fi
            if [ "$task_status" = "FAILED" ] || [ "$task_status" = "CANCELED" ]; then
              echo "SonarQube background task ended with status ${task_status}."
              echo "$task_json" | jq -r '.task.errorMessage // empty'
              exit 1
            fi
            sleep 5
          done

          if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
            echo "SonarQube background task did not finish before timeout." >&2
            exit 1
          fi

          echo "analysis_id=${analysis_id}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Issue Gate
        if: steps.issue-gate-scope.outputs.effective != 'off'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}
          SONAR_PROJECT_KEY: ${{ steps.sonar-identity.outputs.project_key }}
          USE_PULL_REQUEST_SCAN: ${{ inputs.use-pull-request-scan }}
          SONAR_PULL_REQUEST: ${{ inputs.pull-request-key }}
          SONAR_BRANCH_NAME: ${{ inputs.branch-name }}
          ISSUE_GATE_SCOPE: ${{ steps.issue-gate-scope.outputs.effective }}
        run: |
          set -euo pipefail

          base_url="${SONAR_HOST_URL%/}/api/issues/search"
          new_code_param=()
          if [ "$ISSUE_GATE_SCOPE" = "new-code" ]; then
            new_code_param=(--data-urlencode "inNewCodePeriod=true")
          fi

          if [ "$USE_PULL_REQUEST_SCAN" = "true" ]; then
            issues_json=$(curl -fsS -u "${SONAR_TOKEN}:" \
              --get "$base_url" \
              --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
              --data-urlencode "pullRequest=${SONAR_PULL_REQUEST}" \
              --data-urlencode "resolved=false" \
              "${new_code_param[@]}" \
              --data-urlencode "ps=100")
            scope="PR ${SONAR_PULL_REQUEST} (${ISSUE_GATE_SCOPE})"
          else
            issues_json=$(curl -fsS -u "${SONAR_TOKEN}:" \
              --get "$base_url" \
              --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
              --data-urlencode "branch=${SONAR_BRANCH_NAME}" \
              --data-urlencode "resolved=false" \
              "${new_code_param[@]}" \
              --data-urlencode "ps=100")
            scope="${SONAR_BRANCH_NAME} (${ISSUE_GATE_SCOPE})"
          fi

          total=$(echo "$issues_json" | jq -r '.total')
          echo "SonarQube unresolved issue count for ${SONAR_PROJECT_KEY}/${scope}: ${total}"
          if [ "$total" -ne 0 ]; then
            echo "$issues_json" | jq -r '.issues[] | "- \(.severity) \(.type) \(.component):\(.line // "-") \(.message)"'
            exit 1
          fi

      - name: SonarQube Quality Gate Diagnostics
        if: steps.sonar-ce-wait.outputs.analysis_id != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}
          ANALYSIS_ID: ${{ steps.sonar-ce-wait.outputs.analysis_id }}
        run: |
          set -euo pipefail

          api_base="${SONAR_HOST_URL%/}/api"
          gate_json=$(curl -fsS -u "${SONAR_TOKEN}:" "${api_base}/qualitygates/project_status?analysisId=${ANALYSIS_ID}")
          echo "$gate_json" | jq -r '.projectStatus | "SonarQube quality gate status: \(.status)"'
          echo "$gate_json" | jq -r '.projectStatus.conditions[]? | "- \(.metricKey): \(.status) actual=\(.actualValue // "-") threshold=\(.comparator // "") \(.errorThreshold // "-")"'

      - name: SonarQube Quality Gate check
        if: inputs.enforce-quality-gate
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-identity.outputs.host_url }}
