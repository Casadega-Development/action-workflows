# Isolated reusable SonarQube scan: PR vs branch parameters, coverage download, CE wait,
# optional issue gate, and the official quality-gate action.
#
# Callers must grant `actions: read`, `contents: read`, and `packages: read` on the job that `uses:`
# this workflow. Pass SONAR_TOKEN explicitly — `secrets: inherit` does not cross GitHub organization
# boundaries. Node projects with private GitHub Packages dependencies must also map a caller-owned
# package token into NODE_AUTH_TOKEN; the workflow creates the runner-only npm auth entry before
# dependency restoration.
# The checked-out repository's committed `sonar.host.url` is the only server authority. An inherited
# repository variable is compared for diagnostics and ignored when it disagrees.
#
# Adapted from black-flag-collective/action-workflows. Do not pin
# sonarqube-quality-gate-action to v1.3.1 — that tag does not exist.

name: SonarQube Scan

on:
  workflow_call:
    inputs:
      prerequisite-result:
        description: Optional upstream result; anything other than success fails the scan explicitly.
        required: false
        type: string
        default: success
      sonar-node-max-space:
        description: SonarJS Node heap ceiling in MiB; select a value below the scan runner's available RAM.
        required: false
        type: string
        default: '4096'
      runner-labels-json:
        description: >-
          JSON array (or string) for runs-on. Only GitHub-hosted Linux runners are supported so preparation
          and credential-bearing analysis always use separate disposable machines.
        required: false
        type: string
        default: '"ubuntu-latest"'
      fetch-depth:
        description: Git fetch depth for checkout; 0 disables shallow clone (recommended for Sonar).
        required: false
        type: number
        default: 0
      checkout-ref:
        description: Git ref to checkout (commit SHA or branch). Empty uses the default ref for the event.
        required: false
        type: string
        default: ""
      coverage-artifacts-json:
        description: >-
          JSON array of {"name":"<GitHub artifact name>","path":"<repo-relative dir>"}.
          Empty skips all coverage downloads. Non-empty downloads each artifact before scan.
        required: false
        type: string
        default: ""
      coverage-artifacts-run-id:
        description: >-
          Workflow run ID to download coverage artifacts from. Empty uses the current workflow run.
        required: false
        type: string
        default: ""
      install-node-dependencies:
        description: >-
          Whether to restore a Node project's locked dependencies before analysis. auto installs
          when node-project-directory contains package.json and exactly one recognized lockfile;
          true requires that shape; false opts out. Installing dependencies allows SonarJS to
          resolve external type declarations instead of degrading semantic TypeScript analysis.
        required: false
        type: string
        default: auto
      node-project-directory:
        description: >-
          Repository-relative directory containing package.json and its lockfile. This supports
          repositories whose Node project is not at the checkout root without accepting an
          arbitrary dependency-install shell command.
        required: false
        type: string
        default: "."
      node-version-file:
        description: >-
          File, relative to node-project-directory, used by actions/setup-node. The workflow uses
          it when present, otherwise package.json when it declares a supported Node version, and
          finally the current LTS release.
        required: false
        type: string
        default: .nvmrc
      pnpm-version:
        description: >-
          pnpm version used only when pnpm-lock.yaml is authoritative. Empty derives the version
          from package.json's packageManager field; pnpm repositories without either value fail
          before installation with an actionable error.
        required: false
        type: string
        default: ""
      pre-sonar-command:
        description: >-
          Optional shell command after checkout and coverage download, before Sonar scanner
          (e.g. node scripts/generate-sonar-coverage-exclusions.mjs).
        required: false
        type: string
        default: ""
      use-pull-request-scan:
        description: Use sonar.pullrequest.* parameters (Community branch plugin PR decoration).
        required: false
        type: boolean
        default: false
      pull-request-key:
        description: PR number for sonar.pullrequest.key when use-pull-request-scan is true.
        required: false
        type: string
        default: ""
      pull-request-branch:
        description: Head branch for sonar.pullrequest.branch.
        required: false
        type: string
        default: ""
      pull-request-base:
        description: Base branch for sonar.pullrequest.base.
        required: false
        type: string
        default: ""
      scm-revision:
        description: Commit SHA for sonar.scm.revision (PR scans).
        required: false
        type: string
        default: ""
      branch-name:
        description: Branch name for sonar.branch.name when use-pull-request-scan is false.
        required: false
        type: string
        default: ""
      issue-gate-scope:
        description: >-
          Extra unresolved-issue API gate after CE processing. all-open = fail on any unresolved
          issue on the PR/branch (default). new-code = fail on unresolved issues in new code
          (inNewCodePeriod). off = Quality Gate only (no API issue gate).
        required: false
        type: string
        default: all-open
      enforce-zero-unreviewed-hotspots:
        description: Independently fail on any TO_REVIEW hotspot in the selected PR or branch, regardless of the server quality gate.
        required: false
        type: boolean
        default: false
      enforce-quality-gate:
        description: >-
          Run the official sonarqube-quality-gate-action after diagnostics. Set false for
          baselined repos that still need scan uploads and Quality Gate diagnostics without
          failing the GitHub workflow on the project gate.
        required: false
        type: boolean
        default: true
      enforce-zero-open-issues:
        description: >-
          Deprecated — use issue-gate-scope. When true and issue-gate-scope is off, behaves as
          all-open.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: >-
          SonarQube project analysis token from the calling repository. A user
          token is for local CLI/precheck only; CI must use a project analysis
          token (or a user token with Execute Analysis on that project).
        required: true
      NODE_AUTH_TOKEN:
        description: >-
          Optional GitHub Packages read token exposed only while configuring registry auth and
          installing dependencies. Map a caller-owned token when package.json resolves private
          GitHub packages; public-only projects may omit it.
        required: false

# Identity resolution never executes checked-out code. Preparation has no Sonar token.
# Analysis consumes only validated data on a different GitHub-hosted runner.
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      host-url: ${{ steps.sonar-identity.outputs.host_url }}
      project-key: ${{ steps.sonar-identity.outputs.project_key }}
      revision: ${{ steps.source.outputs.commit }}
      handoff-name: ${{ steps.sonar-identity.outputs.handoff_name }}
    steps:
      - name: Require successful prerequisite
        env:
          PREREQUISITE_RESULT: ${{ inputs.prerequisite-result }}
          NODE_MAX_SPACE: ${{ inputs.sonar-node-max-space }}
        run: |
          set -euo pipefail
          if [ "$PREREQUISITE_RESULT" != success ]; then
            echo "::error::The caller prerequisite did not succeed (${PREREQUISITE_RESULT})."
            exit 1
          fi
          if ! [[ "$NODE_MAX_SPACE" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::sonar-node-max-space must be a positive integer in MiB."
            exit 1
          fi

      # The PR base/default branch owns the service identity. A head cannot redirect its token.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: .sonar-authority
          persist-credentials: false

      - name: Resolve committed SonarQube identity
        id: sonar-identity
        env:
          # Retain the former caller variable only as a migration diagnostic. It must never select
          # where a checked-out repository publishes source.
          AMBIENT_SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail

          # Node is already present on every supported GitHub-hosted runner and gives this preflight
          # standards-based URL parsing. Keeping the parser here makes the reusable workflow
          # self-contained because actions/checkout checks out the caller, not this catalog repo.
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';

          const propertiesPath = '.sonar-authority/sonar-project.properties';

          /**
           * Stops the identity preflight with a concise GitHub Actions annotation.
           *
           * @param {string} message Actionable configuration failure without credential material.
           * @returns {never} This helper always terminates the current Node process.
           */
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          /**
           * Reads one required plain-text Sonar property without accepting a lookalike key.
           *
           * Both `=` and `:` separators are valid Java Properties syntax. Anchored expressions
           * prevent names such as `sonar.host.urlsuffix` from satisfying the server identity check.
           *
           * @param {string} contents Complete scanner properties contents.
           * @param {RegExp} pattern Anchored property-specific extraction expression.
           * @param {string} key Human-readable property name used in failures.
           * @returns {string} Non-empty committed value.
           */
          function readRequiredProperty(contents, pattern, key) {
            for (const line of contents.split(/\r?\n/u)) {
              const match = pattern.exec(line);
              const value = match?.[1]?.trim();
              if (value) return value;
            }
            fail(`${propertiesPath} must define a non-empty ${key}.`);
          }

          /**
           * Canonicalizes a SonarQube server while preserving a meaningful context path.
           *
           * URL parsing normalizes scheme and hostname case plus default ports. Trailing separators
           * are removed with a linear loop so the safety preflight cannot introduce a
           * backtracking-regex hotspot of its own.
           *
           * @param {string} value Candidate committed or ambient server URL.
           * @returns {string} Canonical HTTP(S) server URL without trailing slashes.
           */
          function normalizeHost(value) {
            const parsed = new URL(value.trim());
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
              throw new Error('sonar.host.url must use HTTP or HTTPS.');
            }
            if (parsed.username || parsed.password) {
              throw new Error('sonar.host.url must not contain embedded credentials.');
            }
            parsed.search = '';
            parsed.hash = '';
            let normalized = parsed.toString();
            while (normalized.endsWith('/')) normalized = normalized.slice(0, -1);
            return normalized;
          }

          let contents;
          try {
            contents = readFileSync(propertiesPath, 'utf8');
          } catch {
            fail(`Unable to read committed ${propertiesPath}.`);
          }

          const rawHost = readRequiredProperty(
            contents,
            /^\s*sonar\.host\.url\s*[=:]\s*(.*?)\s*$/u,
            'sonar.host.url',
          );
          const projectKey = readRequiredProperty(
            contents,
            /^\s*sonar\.projectKey\s*[=:]\s*(.*?)\s*$/u,
            'sonar.projectKey',
          );
          let hostUrl;
          try {
            hostUrl = normalizeHost(rawHost);
          } catch {
            fail(
              `${propertiesPath} must define sonar.host.url as a fully-qualified HTTP(S) URL without embedded credentials.`,
            );
          }
          const ambientHost = process.env.AMBIENT_SONAR_HOST_URL?.trim();

          if (ambientHost) {
            let conflicts = true;
            try {
              conflicts = normalizeHost(ambientHost) !== hostUrl;
            } catch {
              // A malformed inherited variable is still a conflict, but its value is deliberately
              // omitted from logs in case someone accidentally embedded credentials in it.
            }
            if (conflicts) {
              console.warn(
                `::warning::Ignoring SONAR_HOST_URL because committed ${propertiesPath} pins ${hostUrl}.`,
              );
            }
          }

          // A trusted unique name prevents two consumers in one run from colliding on an artifact.
          appendFileSync(process.env.GITHUB_OUTPUT, `host_url=${hostUrl}\nproject_key=${projectKey}\nhandoff_name=sonar-inputs-${randomUUID()}\n`);
          console.log(`Using committed SonarQube host ${hostUrl} for project ${projectKey}.`);
          NODE

      # Resolve once before preparation so mutable checkout-ref inputs cannot select two revisions.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: source
        with:
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}
          path: .sonar-source
          persist-credentials: false

  prepare:
    needs: identity
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Require disposable Linux runner
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ] || [ "$RUNNER_OS" != Linux ]; then
            echo "::error::Sonar jobs require disposable GitHub-hosted Linux runners."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false

      - name: Resolve Node dependency installation
        id: node-dependencies
        env:
          INSTALL_MODE: ${{ inputs.install-node-dependencies }}
          NODE_PROJECT_DIRECTORY: ${{ inputs.node-project-directory }}
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          PNPM_VERSION_OVERRIDE: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail

          # Normalize the configured project directory before inspecting files. Restricting the
          # value to the checked-out repository prevents a reusable-workflow caller from making
          # the install or cache steps operate on runner-owned paths outside the source tree.
          project_directory="${NODE_PROJECT_DIRECTORY%/}"
          if [ -z "$project_directory" ]; then
            project_directory="."
          fi
          case "$project_directory$NODE_VERSION_FILE$PNPM_VERSION_OVERRIDE" in
            *$'\n'*|*$'\r'*)
              echo "::error::Node dependency inputs must be single-line values."
              exit 1
              ;;
          esac
          case "$project_directory" in
            /*|..|../*|*/../*|*/..)
              echo "::error::node-project-directory must remain inside the checked-out repository."
              exit 1
              ;;
          esac
          case "$NODE_VERSION_FILE" in
            /*|..|../*|*/../*|*/..)
              echo "::error::node-version-file must remain inside node-project-directory."
              exit 1
              ;;
          esac
          if [ ! -d "$project_directory" ]; then
            echo "::error::node-project-directory does not exist: ${project_directory}"
            exit 1
          fi
          workspace_path=$(realpath "$GITHUB_WORKSPACE")
          project_path=$(realpath "$project_directory")
          case "$project_path" in
            "$workspace_path"|"$workspace_path"/*) ;;
            *)
              echo "::error::node-project-directory resolves outside the checked-out repository."
              exit 1
              ;;
          esac

          package_json="${project_directory}/package.json"
          lockfile_count=0
          package_manager=""
          lockfile_path=""

          # A single authoritative lockfile is required for reproducible analysis. Silently
          # preferring one package manager would let Sonar analyze a dependency graph that differs
          # from the graph used by the repository's own quality and build jobs.
          if [ -f "${project_directory}/package-lock.json" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="npm"
            lockfile_path="${project_directory}/package-lock.json"
          fi
          if [ -f "${project_directory}/npm-shrinkwrap.json" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="npm"
            lockfile_path="${project_directory}/npm-shrinkwrap.json"
          fi
          if [ -f "${project_directory}/pnpm-lock.yaml" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="pnpm"
            lockfile_path="${project_directory}/pnpm-lock.yaml"
          fi
          if [ -f "${project_directory}/yarn.lock" ]; then
            lockfile_count=$((lockfile_count + 1))
            package_manager="yarn"
            lockfile_path="${project_directory}/yarn.lock"
          fi

          if [ "$lockfile_count" -gt 1 ]; then
            echo "::error::Found multiple recognized lockfiles in ${project_directory}; keep exactly one authoritative package-manager lockfile."
            exit 1
          fi

          case "$INSTALL_MODE" in
            auto)
              if [ -f "$package_json" ] && [ "$lockfile_count" -eq 1 ]; then
                should_install=true
              else
                should_install=false
              fi
              ;;
            true)
              if [ ! -f "$package_json" ]; then
                echo "::error::install-node-dependencies=true requires ${package_json}."
                exit 1
              fi
              if [ "$lockfile_count" -ne 1 ]; then
                echo "::error::install-node-dependencies=true requires exactly one recognized lockfile in ${project_directory}."
                exit 1
              fi
              should_install=true
              ;;
            false)
              should_install=false
              ;;
            *)
              echo "::error::install-node-dependencies must be auto, true, or false; received '${INSTALL_MODE}'."
              exit 1
              ;;
          esac

          if [ "$INSTALL_MODE" = "auto" ] && [ "$should_install" = false ]; then
            if [ -f "$package_json" ] && [ "$lockfile_count" -eq 0 ]; then
              echo "::warning::Found ${package_json} without a recognized lockfile. Dependencies will not be installed, so SonarJS type inference may be incomplete."
            elif [ ! -f "$package_json" ] && [ "$lockfile_count" -eq 1 ]; then
              echo "::warning::Found ${lockfile_path} without ${package_json}; dependencies cannot be restored."
            else
              echo "::notice::No locked Node project found in ${project_directory}; skipping dependency installation."
            fi
          fi

          declared_package_manager=""
          declared_package_manager_version=""
          if [ -f "$package_json" ]; then
            package_manager_declaration=$(jq -r '.packageManager // empty' "$package_json")
            case "$package_manager_declaration" in
              *$'\n'*|*$'\r'*)
                echo "::error::packageManager in ${package_json} must be a single-line value."
                exit 1
                ;;
            esac
            case "$package_manager_declaration" in
              npm@*|pnpm@*|yarn@*)
                declared_package_manager="${package_manager_declaration%%@*}"
                declared_package_manager_version="${package_manager_declaration#*@}"
                declared_package_manager_version="${declared_package_manager_version%%+*}"
                ;;
              "") ;;
              *)
                echo "::error::Unsupported packageManager declaration in ${package_json}: ${package_manager_declaration}"
                exit 1
                ;;
            esac
          fi

          if [ "$should_install" = true ] && [ -n "$declared_package_manager" ] && [ "$declared_package_manager" != "$package_manager" ]; then
            echo "::error::packageManager declares ${declared_package_manager}, but ${lockfile_path} selects ${package_manager}."
            exit 1
          fi

          pnpm_version="$PNPM_VERSION_OVERRIDE"
          if [ "$should_install" = true ] && [ "$package_manager" = "pnpm" ] && [ -z "$pnpm_version" ]; then
            if [ "$declared_package_manager" != "pnpm" ] || [ -z "$declared_package_manager_version" ]; then
              echo "::error::A pnpm project must declare packageManager as pnpm@<version> or pass pnpm-version."
              exit 1
            fi
            pnpm_version="$declared_package_manager_version"
          fi

          version_file=""
          node_version=""
          configured_version_file="${project_directory}/${NODE_VERSION_FILE}"
          if [ "$should_install" = true ] && [ -n "$NODE_VERSION_FILE" ] && [ -f "$configured_version_file" ]; then
            version_file="$configured_version_file"
          elif [ "$should_install" = true ] && jq -e \
            '(.volta.node != null) or (.engines.node != null) or (.devEngines.runtime != null)' \
            "$package_json" >/dev/null 2>&1; then
            version_file="$package_json"
            echo "::notice::Using the Node version declared by ${package_json}."
          else
            node_version="lts/*"
          fi

          # Every emitted value is derived from a validated path or a fixed enumeration. The
          # workflow deliberately avoids accepting an arbitrary install command and forwarding it
          # through GITHUB_OUTPUT, which would make newline handling and shell trust ambiguous.
          {
            echo "should-install=${should_install}"
            echo "package-manager=${package_manager}"
            echo "project-directory=${project_directory}"
            echo "lockfile-path=${lockfile_path}"
            echo "version-file=${version_file}"
            echo "node-version=${node_version}"
            echo "pnpm-version=${pnpm_version}"
          } >> "$GITHUB_OUTPUT"

          echo "Node dependency install: ${should_install} (mode=${INSTALL_MODE}, manager=${package_manager:-none}, directory=${project_directory})."

      # setup-node's pnpm cache invokes `pnpm store path`, so pnpm must already be on PATH. The
      # exact version is taken from the consumer's committed packageManager declaration unless an
      # explicit reusable-workflow input overrides it.
      - name: Set up pnpm
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ steps.node-dependencies.outputs.pnpm-version }}
          run_install: false

      - name: Set up Node.js for dependency analysis
        if: steps.node-dependencies.outputs.should-install == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ steps.node-dependencies.outputs.version-file }}
          node-version: ${{ steps.node-dependencies.outputs.node-version }}
          cache: ${{ steps.node-dependencies.outputs.package-manager }}
          cache-dependency-path: ${{ steps.node-dependencies.outputs.lockfile-path }}

      - name: Configure private GitHub Packages authentication
        if: steps.node-dependencies.outputs.should-install == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          # Public-only callers legitimately omit the optional secret. Avoid
          # writing an empty credential that could override a developer-style
          # host entry checked into a purpose-built CI fixture.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No private package token was supplied; continuing with public registry access."
            exit 0
          fi

          # Write npm's environment placeholder, not the secret value. npm,
          # pnpm, and Yarn resolve the placeholder only inside their install
          # steps, where NODE_AUTH_TOKEN is deliberately scoped. This lets
          # consuming repositories keep credentials out of project .npmrc
          # files and preserves normal user-level ~/.npmrc authentication.
          # npm must receive the placeholder literally so it expands only
          # inside the authenticated install.
          # shellcheck disable=SC2016
          npm config set \
            "//npm.pkg.github.com/:_authToken" \
            '${NODE_AUTH_TOKEN}' \
            --location=user

      - name: Install locked npm dependencies
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'npm'
        working-directory: ${{ steps.node-dependencies.outputs.project-directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Install locked pnpm dependencies
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'pnpm'
        working-directory: ${{ steps.node-dependencies.outputs.project-directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Install locked Yarn dependencies
        if: steps.node-dependencies.outputs.should-install == 'true' && steps.node-dependencies.outputs.package-manager == 'yarn'
        working-directory: ${{ steps.node-dependencies.outputs.project-directory }}
        run: yarn install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Download coverage artifacts
        if: inputs.coverage-artifacts-json != '' && inputs.coverage-artifacts-json != '[]'
        env:
          COVERAGE_ARTIFACTS_JSON: ${{ inputs.coverage-artifacts-json }}
          COVERAGE_ARTIFACTS_RUN_ID: ${{ inputs.coverage-artifacts-run-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! echo "$COVERAGE_ARTIFACTS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null; then
            echo "coverage-artifacts-json must be a non-empty JSON array." >&2
            exit 1
          fi

          if [ -n "$COVERAGE_ARTIFACTS_RUN_ID" ]; then
            RUN_ID="$COVERAGE_ARTIFACTS_RUN_ID"
          else
            RUN_ID="$GITHUB_RUN_ID"
          fi

          succeeded=0
          failed=0
          while IFS= read -r item; do
            name=$(echo "$item" | jq -r '.name')
            path=$(echo "$item" | jq -r '.path')
            if [ -z "$name" ] || [ "$name" = "null" ] || [ -z "$path" ] || [ "$path" = "null" ]; then
              echo "::warning::Skipping invalid coverage artifact entry: ${item}"
              failed=$((failed + 1))
              continue
            fi
            mkdir -p "$path"
            if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D "$path"; then
              echo "Downloaded artifact ${name} to ${path}"
              succeeded=$((succeeded + 1))
            else
              echo "::warning::Failed to download artifact ${name} (run ${RUN_ID}) to ${path}"
              failed=$((failed + 1))
            fi
          done < <(echo "$COVERAGE_ARTIFACTS_JSON" | jq -c '.[]')

          if [ "$succeeded" -eq 0 ]; then
            # Artifact downloads are transiently flaky (expired/missing artifacts).
            # Continue without coverage instead of failing the scan.
            echo "::warning::No coverage artifacts downloaded (${failed} failed); continuing without coverage."
          fi

      - name: Pre-Sonar command
        if: inputs.pre-sonar-command != ''
        run: ${{ inputs.pre-sonar-command }}

      - name: Package analysis data
        env:
          EXPECTED_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          workspace = Path.cwd().resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'sonar-handoff'
          output.mkdir()
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'))
          def regular_file_data(member):
              """Materialize repeated regular-file inodes; preserve symbolic links for confinement checks."""
              # pnpm hardlinks reviewed package files. tarfile otherwise deduplicates those inodes
              # into hardlink members, which the independent extraction boundary correctly refuses.
              if member.islnk():
                  source = workspace / member.name
                  if source.is_symlink():
                      raise ValueError('A regular dependency file changed into a symbolic link.')
                  member.type = tarfile.REGTYPE
                  member.linkname = ''
                  member.size = source.stat().st_size
              return member

          with tarfile.open(output / 'inputs.tar.gz' , 'w:gz', dereference=False) as archive:
              for parent, directories, filenames in os.walk(workspace, followlinks=False):
                  directories[:] = [name for name in directories if name not in ('.git', 'node_modules', '.scannerwork')]
                  for name in filenames:
                      source = Path(parent) / name
                      local = source.relative_to(workspace).as_posix()
                      # Only reports and the one declared generated properties file cross this boundary.
                      # Tracked application code and arbitrary generated credential JSON are excluded.
                      generated = local == 'sonar-project.coverage.generated.properties'
                      report = source.suffix in ('.info', '.lcov', '.xml') or ('coverage' in source.parts and source.suffix == '.json')
                      if generated or (report and local not in tracked):
                          archive.add(source, arcname=local, recursive=False, filter=regular_file_data)
          with tarfile.open(output / 'modules.tar.gz', 'w:gz', dereference=False) as archive:
              for parent, directories, _ in os.walk(workspace, followlinks=False):
                  directories[:] = [name for name in directories if name != '.git']
                  if 'node_modules' in directories:
                      source = Path(parent) / 'node_modules'
                      archive.add(source, arcname=source.relative_to(workspace).as_posix(), filter=regular_file_data)
                      directories.remove('node_modules')
          (output / 'manifest.json').write_text(json.dumps({'revision': os.environ['EXPECTED_REVISION'], 'workspace': str(workspace)}))
          PY

      - name: Upload analysis data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.identity.outputs.handoff-name }}
          path: ${{ runner.temp }}/sonar-handoff/
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    needs: [identity, prepare]
    # A preparation or identity failure must produce a failed scan, never a skipped required check.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SONAR_PROJECT_KEY: ${{ needs.identity.outputs.project-key }}
    steps:
      - name: Require disposable Linux runner
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ] || [ "$RUNNER_OS" != Linux ]; then
            echo "::error::Sonar jobs require disposable GitHub-hosted Linux runners."
            exit 1
          fi

      - name: Require prepared analysis
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          set -euo pipefail
          if [ "$IDENTITY_RESULT" != success ] || [ "$PREPARE_RESULT" != success ]; then
            echo "::error::Sonar identity or preparation failed; no scanner or credentialed API call will run."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false

      - name: Download analysis data
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.identity.outputs.handoff-name }}
          path: ${{ runner.temp }}/sonar-handoff/

      - name: Unpack validated analysis data
        env:
          EXPECTED_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import posixpath
          import shutil
          import tarfile
          import tempfile

          workspace = Path.cwd().resolve()
          source = Path(os.environ['RUNNER_TEMP']) / 'sonar-handoff'
          manifest = json.loads((source / 'manifest.json').read_text())
          if manifest.get('revision') != os.environ['EXPECTED_REVISION']:
              raise SystemExit('Analysis data does not match the independently resolved source revision.')

          def inside(root, candidate):
              """Check resolved ancestry so symlink chains cannot redirect writes outside the boundary."""
              return candidate.resolve().is_relative_to(root.resolve())

          def unpack(archive_path, target, modules):
              """Write regular data first, then confined links; never extract a member through a link."""
              links = []
              with tarfile.open(archive_path) as archive:
                  for member in archive:
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or not path.parts or chr(92) in member.name or any(ord(char) < 32 for char in member.name):
                          raise ValueError('Unsafe archive member path.')
                      if '.git' in path.parts or '.scannerwork' in path.parts:
                          raise ValueError('Git/scanner state cannot be transferred.')
                      if modules and 'node_modules' not in path.parts:
                          # Parent directories carry no payload; all files and links must be dependencies.
                          if member.isdir():
                              continue
                          raise ValueError('Dependency data is outside node_modules.')
                      destination = target / member.name
                      if member.isdir():
                          destination.mkdir(parents=True, exist_ok=True)
                      elif member.isfile():
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          stream = archive.extractfile(member)
                          if stream is None:
                              raise ValueError('Archive member has no readable data.')
                          with stream, destination.open('xb') as output:
                              shutil.copyfileobj(stream, output)
                      elif modules and member.issym():
                          link = PurePosixPath(member.linkname)
                          resolved = PurePosixPath(posixpath.normpath(str(path.parent / link)))
                          if link.is_absolute() or '..' in resolved.parts or chr(92) in member.linkname:
                              raise ValueError('Dependency link leaves its data boundary.')
                          links.append((destination, member.linkname))
                      else:
                          raise ValueError('Only regular report data and confined dependency links are accepted.')
              for destination, link in links:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.symlink_to(link)
              for destination, _ in links:
                  if not inside(target, destination):
                      raise ValueError('Dependency link chain leaves its data boundary.')

          for name in ('sonar-project.properties', 'sonar-project.coverage.generated.properties'):
              if (workspace / name).is_symlink():
                  raise SystemExit('Scanner settings must be real files, not symbolic links.')
          scanner_state = workspace / '.scannerwork'
          if scanner_state.is_symlink() or scanner_state.is_file():
              scanner_state.unlink()
          elif scanner_state.exists():
              shutil.rmtree(scanner_state)
          with tempfile.TemporaryDirectory(prefix='sonar-unpack-', dir=os.environ['RUNNER_TEMP']) as temporary:
              staging = Path(temporary)
              reports, modules = staging / 'reports', staging / 'modules'
              reports.mkdir()
              modules.mkdir()
              unpack(source / 'inputs.tar.gz', reports, False)
              unpack(source / 'modules.tar.gz', modules, True)
              for report in reports.rglob('*'):
                  if not report.is_file():
                      continue
                  local = report.relative_to(reports)
                  generated = local.as_posix() == 'sonar-project.coverage.generated.properties'
                  allowed = report.suffix in ('.info', '.lcov', '.xml') or ('coverage' in local.parts and report.suffix == '.json')
                  destination = workspace / local
                  if not (generated or allowed) or not inside(workspace, destination.parent):
                      raise ValueError('Report path is not permitted.')
                  # exists() follows links and is false for dangling ones. Refuse the link
                  # itself so copying a report cannot create its nonexistent external target.
                  if destination.is_symlink() or (destination.exists() and not generated):
                      raise ValueError('Report data cannot replace checked-out source files.')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(report, destination, follow_symlinks=False)
                  # LCOV embeds absolute paths; only its source-path records need runner relocation.
                  previous = manifest.get('workspace')
                  if destination.suffix in ('.info', '.lcov') and isinstance(previous, str) and previous.startswith('/'):
                      content = destination.read_text()
                      destination.write_text(content.replace('SF:' + previous + '/', 'SF:' + str(workspace) + '/'))
              roots = sorted([path for path in modules.rglob('node_modules') if not any(parent.name == 'node_modules' for parent in path.relative_to(modules).parents)], key=lambda path: len(path.parts))
              for directory in roots:
                  destination = workspace / directory.relative_to(modules)
                  if not inside(workspace, destination.parent):
                      raise ValueError('Dependency destination escapes through checked-out links.')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if destination.is_symlink() or destination.is_file():
                      destination.unlink()
                  elif destination.exists():
                      shutil.rmtree(destination)
                  shutil.move(str(directory), destination)
                  for entry in destination.rglob('*'):
                      if entry.is_symlink() and not inside(workspace, entry):
                          raise ValueError('Placed dependency link escapes through checked-out source.')
          PY

      - name: Apply and validate scanner settings
        env:
          EXPECTED_HOST: ${{ needs.identity.outputs.host-url }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit, urlunsplit

          def properties(text):
              """Join Java continuation lines and refuse escaped keys rather than misreading overrides."""
              pending = ''
              continuation = False
              for raw in text.replace('\r\n', '\n').replace('\r', '\n').split('\n'):
                  if not continuation and raw.lstrip().startswith(('#', '!')):
                      continue
                  pending += raw.lstrip(' \t\f') if continuation else raw
                  trailing = len(pending) - len(pending.rstrip(chr(92)))
                  if trailing % 2:
                      pending = pending[:-1]
                      continuation = True
                      continue
                  continuation = False
                  line, pending = pending.lstrip(' \t\f'), ''
                  if not line:
                      continue
                  key = re.split(r'[=: \t\f]', line, maxsplit=1)[0]
                  if chr(92) in key:
                      raise ValueError('Escaped scanner property keys are not accepted.')
                  value = re.sub(r'^[ \t\f]*[=:]?[ \t\f]*', '', line[len(key):]).rstrip(' \t\f')
                  yield key, value
              if pending:
                  raise ValueError('Unfinished scanner property continuation.')

          def host(value):
              """Normalize the endpoint without accepting credentials or Java escape sequences."""
              if chr(92) in value or any(ord(char) < 33 for char in value):
                  raise ValueError('Scanner endpoint must be a plain URL.')
              url = urlsplit(value)
              if url.scheme not in ('http', 'https') or not url.hostname or url.username or url.password or url.query or url.fragment:
                  raise ValueError('Scanner endpoint is invalid.')
              hostname = url.hostname.encode('idna').decode().lower()
              if ':' in hostname:
                  hostname = '[' + hostname + ']'
              port = url.port
              authority = hostname if port is None or (url.scheme, port) in (('http', 80), ('https', 443)) else hostname + ':' + str(port)
              return urlunsplit((url.scheme, authority, url.path.rstrip('/'), '', ''))

          settings = Path('sonar-project.properties')
          generated = Path('sonar-project.coverage.generated.properties')
          if settings.is_symlink() or generated.is_symlink():
              raise SystemExit('Scanner settings cannot be symbolic links.')
          text = settings.read_text()
          if generated.exists():
              text += '\n' + generated.read_text()
          parsed = dict(properties(text))
          for key, value in properties(text):
              # Executables, JVM arguments, proxy/trust-store settings and scanner state cannot be
              # controlled by data produced on the runner that executed pull-request code.
              if re.search(r'^sonar\.(scanner\.|nodejs\.|javascript\.node|login$|token$|password$|userHome$)', key) or re.search(r'(^|\.)sonar\.(projectBaseDir|working\.directory)$', key) or re.search(r'^(https?\.|socks|javax\.net\.ssl\.|java\.)', key):
                  raise SystemExit('Refused scanner override: ' + key)
              if key == 'sonar.host.url' and host(value) != os.environ['EXPECTED_HOST']:
                  raise SystemExit('Scanner host differs from the trusted committed endpoint.')
              if key == 'sonar.projectKey' and value != os.environ['SONAR_PROJECT_KEY']:
                  raise SystemExit('Scanner project differs from the trusted committed project.')
          if 'sonar.host.url' not in parsed or 'sonar.projectKey' not in parsed:
              raise SystemExit('Scanner identity is missing.')
          settings.write_text(text)
          PY

      - name: Keep build tools out of analysis
        run: |
          set -euo pipefail
          # The scanner can read dependency declarations, but no package manager/build command may
          # execute repository code on the runner receiving the Sonar credential.
          shims="$RUNNER_TEMP/sonar-no-build-tools"
          mkdir -p "$shims"
          for tool in cargo cargo-clippy clippy-driver rustc rustup npm npx pnpm yarn corepack bun; do
            printf '#!/bin/sh\necho "Build tools are unavailable in isolated Sonar analysis." >&2\nexit 127\n' > "$shims/$tool"
            chmod +x "$shims/$tool"
          done
          echo "$shims" >> "$GITHUB_PATH"

      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty in the reusable workflow. Map it explicitly on the caller job (SONAR_TOKEN from the calling repository). secrets: inherit does not pass repository secrets from a personal repo into Casadega-Development."
            exit 1
          fi

      # Community Edition + sonarqube-community-branch-plugin requires explicit pull-request
      # parameters (and sonar.scm.revision on GitHub). Do not set sonar.branch.* on PR scans.
      # https://github.com/mc1arke/sonarqube-community-branch-plugin#how-to-decorate-a-pull-request
      # The scanner engine occasionally fails transiently (EXECUTION FAILURE / exit 3).
      # Each scan step gets a single retry: the first attempt uses continue-on-error,
      # and the retry step only runs when the first attempt failed.
      - name: SonarQube Scan (pull request)
        id: scan-pr
        if: inputs.use-pull-request-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >-
            -Dsonar.pullrequest.key=${{ inputs.pull-request-key }}
            -Dsonar.pullrequest.branch=${{ inputs.pull-request-branch }}
            -Dsonar.pullrequest.base=${{ inputs.pull-request-base }}
            -Dsonar.scm.revision=${{ inputs.scm-revision }}
            -Dsonar.host.url=${{ needs.identity.outputs.host-url }}
            -Dsonar.qualitygate.wait=false
            -Dsonar.javascript.node.maxspace=${{ inputs.sonar-node-max-space }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}

      - name: SonarQube Scan (pull request, retry)
        if: inputs.use-pull-request-scan && steps.scan-pr.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >-
            -Dsonar.pullrequest.key=${{ inputs.pull-request-key }}
            -Dsonar.pullrequest.branch=${{ inputs.pull-request-branch }}
            -Dsonar.pullrequest.base=${{ inputs.pull-request-base }}
            -Dsonar.scm.revision=${{ inputs.scm-revision }}
            -Dsonar.host.url=${{ needs.identity.outputs.host-url }}
            -Dsonar.qualitygate.wait=false
            -Dsonar.javascript.node.maxspace=${{ inputs.sonar-node-max-space }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}

      - name: SonarQube Scan (branch)
        id: scan-branch
        if: ${{ !inputs.use-pull-request-scan }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >-
            -Dsonar.branch.name=${{ inputs.branch-name }}
            -Dsonar.host.url=${{ needs.identity.outputs.host-url }}
            -Dsonar.qualitygate.wait=false
            -Dsonar.javascript.node.maxspace=${{ inputs.sonar-node-max-space }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}

      - name: SonarQube Scan (branch, retry)
        if: ${{ !inputs.use-pull-request-scan && steps.scan-branch.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >-
            -Dsonar.branch.name=${{ inputs.branch-name }}
            -Dsonar.host.url=${{ needs.identity.outputs.host-url }}
            -Dsonar.qualitygate.wait=false
            -Dsonar.javascript.node.maxspace=${{ inputs.sonar-node-max-space }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}

      - name: Resolve Sonar issue gate scope
        id: issue-gate-scope
        run: |
          set -euo pipefail
          scope="${{ inputs.issue-gate-scope }}"
          case "$scope" in
            off|new-code|all-open) ;;
            *)
              echo "issue-gate-scope must be off, new-code, or all-open (got: ${scope})" >&2
              exit 1
              ;;
          esac
          if [ "$scope" = "off" ] && [ "${{ inputs.enforce-zero-open-issues }}" = "true" ]; then
            echo "::notice::enforce-zero-open-issues is deprecated; using issue-gate-scope=all-open"
            scope="all-open"
          fi
          echo "effective=${scope}" >> "$GITHUB_OUTPUT"
          echo "Sonar issue gate scope: ${scope}"

      - name: Wait for SonarQube background task
        id: sonar-ce-wait
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}
        run: |
          set -euo pipefail

          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "SonarQube report-task.txt is missing; analysis cannot be established." >&2
            exit 1
          fi

          ce_task_id=$(awk -F= '$1 == "ceTaskId" {print $2; exit}' .scannerwork/report-task.txt)
          if [ -z "$ce_task_id" ]; then
            echo "SonarQube ceTaskId is missing; analysis cannot be established." >&2
            exit 1
          fi

          # report-task.txt is produced by the scanner and therefore provides an independent
          # canary that the completed upload used the same authority selected before analysis.
          reported_server_url=$(awk -F= '$1 == "serverUrl" {print $2; exit}' .scannerwork/report-task.txt)
          if [ -n "$reported_server_url" ] && [ "${reported_server_url%/}" != "${SONAR_HOST_URL%/}" ]; then
            echo "SonarScanner reported server ${reported_server_url}, but committed configuration requires ${SONAR_HOST_URL}." >&2
            exit 1
          fi

          api_base="${SONAR_HOST_URL%/}/api"
          analysis_id=""
          for _ in $(seq 1 120); do
            task_json=$(curl -fsS --connect-timeout 5 --max-time 15 -u "${SONAR_TOKEN}:" "${api_base}/ce/task?id=${ce_task_id}")
            task_status=$(echo "$task_json" | jq -r '.task.status')
            if [ "$task_status" = "SUCCESS" ]; then
              analysis_id=$(echo "$task_json" | jq -r '.task.analysisId')
              break
            fi
            if [ "$task_status" = "FAILED" ] || [ "$task_status" = "CANCELED" ]; then
              echo "SonarQube background task ended with status ${task_status}."
              echo "$task_json" | jq -r '.task.errorMessage // empty'
              exit 1
            fi
            sleep 5
          done

          if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
            echo "SonarQube background task did not finish before timeout." >&2
            exit 1
          fi

          echo "analysis_id=${analysis_id}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Issue Gate
        if: steps.issue-gate-scope.outputs.effective != 'off'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}
          USE_PULL_REQUEST_SCAN: ${{ inputs.use-pull-request-scan }}
          SONAR_PULL_REQUEST: ${{ inputs.pull-request-key }}
          SONAR_BRANCH_NAME: ${{ inputs.branch-name }}
          ISSUE_GATE_SCOPE: ${{ steps.issue-gate-scope.outputs.effective }}
        run: |
          set -euo pipefail

          project_key="$SONAR_PROJECT_KEY"
          if [ -z "$project_key" ]; then
            echo "sonar.projectKey is missing from sonar-project.properties" >&2
            exit 1
          fi

          base_url="${SONAR_HOST_URL%/}/api/issues/search"
          issue_params=(--data-urlencode "ps=100")
          if [ "$ISSUE_GATE_SCOPE" = "new-code" ]; then
            issue_params+=(--data-urlencode "inNewCodePeriod=true")
          fi

          fetch_issues() {
            if [ "$USE_PULL_REQUEST_SCAN" = "true" ]; then
              issues_json=$(curl -fsS --connect-timeout 5 --max-time 15 -u "${SONAR_TOKEN}:" \
                --get "$base_url" \
                --data-urlencode "componentKeys=${project_key}" \
                --data-urlencode "pullRequest=${SONAR_PULL_REQUEST}" \
                --data-urlencode "resolved=false" \
                "${issue_params[@]}")
              scope="PR ${SONAR_PULL_REQUEST} (${ISSUE_GATE_SCOPE})"
            else
              issues_json=$(curl -fsS --connect-timeout 5 --max-time 15 -u "${SONAR_TOKEN}:" \
                --get "$base_url" \
                --data-urlencode "componentKeys=${project_key}" \
                --data-urlencode "branch=${SONAR_BRANCH_NAME}" \
                --data-urlencode "resolved=false" \
                "${issue_params[@]}")
              scope="${SONAR_BRANCH_NAME} (${ISSUE_GATE_SCOPE})"
            fi
          }

          # The issue index can lag the finished analysis, so a count must hold
          # before it counts. Two empty reads pass. Three identical non-empty
          # reads fail at once instead of waiting out all twelve.
          zero_reads=0
          same_reads=0
          previous=""
          for attempt in $(seq 1 12); do
            fetch_issues
            if ! total=$(printf '%s' "$issues_json" | jq -er 'if (.total | type) == "number" and .total >= 0 and (.total | floor) == .total and (.issues | type) == "array" and (.issues | length) <= .total and (.total == 0 or (.issues | length) > 0) then .total else error("Invalid issue count") end'); then
              echo "SonarQube did not return a valid issue count." >&2
              exit 1
            fi
            echo "SonarQube unresolved issues for ${project_key}/${scope}, read ${attempt}/12: ${total}"
            if [ "$total" -eq 0 ]; then
              zero_reads=$((zero_reads + 1))
              same_reads=0
              previous=""
              if [ "$zero_reads" -eq 2 ]; then
                echo "SonarQube issue gate passed after two empty reads."
                exit 0
              fi
            else
              zero_reads=0
              current="${total}:$(printf '%s' "$issues_json" | jq -c '[.issues[] | .key // [.component, .line, .message]] | sort')"
              if [ "$current" = "$previous" ]; then
                same_reads=$((same_reads + 1))
              else
                same_reads=1
                previous="$current"
              fi
              if [ "$same_reads" -eq 3 ]; then
                echo "SonarQube issue gate found the same ${total} unresolved issue(s) on three reads." >&2
                break
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$same_reads" -lt 3 ]; then
            echo "SonarQube issue gate did not reach two empty reads before its retry limit." >&2
          fi
          findings=$(printf '%s' "$issues_json" | jq -r '.issues[] | "- \(.severity) \(.type) \(.component):\(.line // "-") \(.message)"')
          printf '%s\n' "$findings"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### SonarQube issue gate: ${total} unresolved issue(s) in ${scope}"
              echo
              printf '%s\n' "$findings"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: SonarQube Hotspot Gate
        # Preserve strict consumer policies independently of ordinary issues and server gate thresholds.
        # The API-only step can still report hotspots after an issue-gate failure; it executes no repo code.
        if: ${{ !cancelled() && steps.sonar-ce-wait.outputs.analysis_id != '' && inputs.enforce-zero-unreviewed-hotspots }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}
          USE_PULL_REQUEST_SCAN: ${{ inputs.use-pull-request-scan }}
          SONAR_PULL_REQUEST: ${{ inputs.pull-request-key }}
          SONAR_BRANCH_NAME: ${{ inputs.branch-name }}
        run: |
          set -euo pipefail
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "sonar.projectKey is required for the hotspot gate." >&2
            exit 1
          fi
          target=(--data-urlencode "branch=${SONAR_BRANCH_NAME}")
          scope="branch ${SONAR_BRANCH_NAME}"
          if [ "$USE_PULL_REQUEST_SCAN" = true ]; then
            target=(--data-urlencode "pullRequest=${SONAR_PULL_REQUEST}")
            scope="PR ${SONAR_PULL_REQUEST}"
          fi

          # Indexing can lag CE completion. Require two empty reads; stable findings fail early.
          zero_reads=0
          same_reads=0
          previous=""
          for attempt in $(seq 1 12); do
            hotspots_json=$(curl -fsS --connect-timeout 5 --max-time 15 -u "${SONAR_TOKEN}:" \
              --get "${SONAR_HOST_URL%/}/api/hotspots/search" \
              --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
              --data-urlencode "status=TO_REVIEW" --data-urlencode "ps=100" "${target[@]}")
            # JSON booleans/strings, negative/fractional counts, missing lists and inconsistent
            # first-page results are unavailable evidence, never proof of a clean analysis.
            if ! total=$(printf '%s' "$hotspots_json" | jq -er 'if (.paging.total | type) == "number" and .paging.total >= 0 and (.paging.total | floor) == .paging.total and (.hotspots | type) == "array" and (.hotspots | length) <= .paging.total and (.paging.total == 0 or (.hotspots | length) > 0) then .paging.total else error("Invalid hotspot response") end'); then
              echo "SonarQube returned an invalid hotspot response." >&2
              exit 1
            fi
            echo "SonarQube unreviewed hotspots for ${SONAR_PROJECT_KEY}/${scope}, read ${attempt}/12: ${total}"
            if [ "$total" -eq 0 ]; then
              zero_reads=$((zero_reads + 1))
              same_reads=0
              previous=""
              if [ "$zero_reads" -eq 2 ]; then
                echo "SonarQube hotspot gate passed after two empty reads."
                exit 0
              fi
            else
              zero_reads=0
              current="${total}:$(printf '%s' "$hotspots_json" | jq -c '[.hotspots[] | .key // [.component, .line, .message]] | sort')"
              if [ "$current" = "$previous" ]; then
                same_reads=$((same_reads + 1))
              else
                same_reads=1
                previous="$current"
              fi
              if [ "$same_reads" -eq 3 ]; then break; fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "SonarQube did not establish zero unreviewed hotspots within its retry budget." >&2
          findings=$(printf '%s' "$hotspots_json" | jq -r '.hotspots[] | "- \(.vulnerabilityProbability // "-") \(.component):\(.line // "-") \(.message)"')
          printf '%s\n' "$findings"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### SonarQube hotspot gate: ${total} unreviewed hotspot(s) in ${scope} (first 100 shown)"
              echo
              printf '%s\n' "$findings"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: SonarQube Quality Gate Diagnostics
        # Read-only, so it also runs when the issue gate already failed.
        if: ${{ !cancelled() && steps.sonar-ce-wait.outputs.analysis_id != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}
          ANALYSIS_ID: ${{ steps.sonar-ce-wait.outputs.analysis_id }}
          USE_PULL_REQUEST_SCAN: ${{ inputs.use-pull-request-scan }}
          SONAR_PULL_REQUEST: ${{ inputs.pull-request-key }}
          SONAR_BRANCH_NAME: ${{ inputs.branch-name }}
        run: |
          set -euo pipefail

          api_base="${SONAR_HOST_URL%/}/api"
          gate_json=$(curl -fsS --connect-timeout 5 --max-time 15 -u "${SONAR_TOKEN}:" "${api_base}/qualitygates/project_status?analysisId=${ANALYSIS_ID}")
          echo "$gate_json" | jq -r '.projectStatus | "SonarQube quality gate status: \(.status)"'
          echo "$gate_json" | jq -r '.projectStatus.conditions[]? | "- \(.metricKey): \(.status) actual=\(.actualValue // "-") threshold=\(.comparator // "") \(.errorThreshold // "-")"'

          # An unreviewed hotspot fails the gate without naming the code. List
          # each one so the fix, or the review in SonarQube, can start here.
          if echo "$gate_json" | jq -e '[.projectStatus.conditions[]? | select(.status == "ERROR" and (.metricKey | test("hotspot")))] | length > 0' >/dev/null; then
            project_key="$SONAR_PROJECT_KEY"
            if [ "$USE_PULL_REQUEST_SCAN" = "true" ]; then
              target=(--data-urlencode "pullRequest=${SONAR_PULL_REQUEST}")
            else
              target=(--data-urlencode "branch=${SONAR_BRANCH_NAME}")
            fi
            if hotspots_json=$(curl -fsS --connect-timeout 5 --max-time 15 -u "${SONAR_TOKEN}:" --get "${api_base}/hotspots/search" \
              --data-urlencode "projectKey=${project_key}" --data-urlencode "status=TO_REVIEW" --data-urlencode "ps=100" "${target[@]}"); then
              hotspots=$(printf '%s' "$hotspots_json" | jq -r '.hotspots[]? | "- \(.vulnerabilityProbability // "-") \(.component):\(.line // "-") \(.message)"')
              echo "Security hotspots to review:"
              printf '%s\n' "$hotspots"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                {
                  echo "### SonarQube security hotspots to review"
                  echo
                  echo "Change the code, or mark each one reviewed in SonarQube, then re-run this check."
                  echo
                  printf '%s\n' "$hotspots"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Could not list the security hotspots." >&2
            fi
          fi

      - name: SonarQube Quality Gate check
        if: inputs.enforce-quality-gate
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ needs.identity.outputs.host-url }}
